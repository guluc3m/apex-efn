openapi: 3.1.0
info:
  title: APEX-EFN Public API
  version: 1.0.0
  summary: Public HTTP API of the APEX-EFN orchestrator (versioned by path prefix /v1).
  description: "Source of truth for every DTO shared between the web app, the orchestrator and the tooling\n(spec section 5.1). TypeScript types and Zod schemas are generated into\npackages/shared-types/src/generated/ and Pydantic v2 models into\napps/orchestrator/src/apex/contracts/generated/. Never edit generated files by hand.\n\nConventions:\n- Money is always `Money {amount_minor: int64, currency}`. Floats are forbidden for money and FX.\n- Currencies are the closed enum EUR | USD | CNY (spec 3.5.1).\n- Writes require `Idempotency-Key`. Lists are cursor-paginated (`items`, `next_cursor`).\n- Errors are RFC 9457 `application/problem+json`.\n- A signing session that is missing, expired, revoked or exhausted returns\n  `428 {error: \"reauth_required\", reason}` (spec 5.10.4). Clients must never sign silently.\n- Business actions that change state are signed decisions. The action endpoint (deal action, gate\n  queue action, config proposal, snapshot activation) builds the canonical payload\
    \ on the server and\n  answers `202 DecisionAccepted {decision_id, status: pending_signature}`. The client signs it with\n  POST /v1/decisions/{id}/sign. Nothing changes until the decision is signed.\n- Unset configuration values (spec section 7, \"sin definir\") are `null`, never invented defaults.\n"
  license: {name: UNLICENSED}
servers:
- {url: 'http://localhost:8000', description: Local orchestrator (docker compose)}
security:
- bearerAuth: []
tags:
- {name: onboarding}
- {name: sourcing}
- {name: missions}
- {name: sellers}
- {name: dashboard}
- {name: gate}
- {name: negotiations}
- {name: signing}
- {name: decisions}
- {name: keys}
- {name: audit}
- {name: webhooks}
- {name: config}
paths:
  /v1/onboarding/sessions:
    post:
      tags: [onboarding]
      operationId: createOnboardingSession
      summary: Start a profiling conversation (IntakeAgent) and progressive form.
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateOnboardingSessionRequest'}
      responses:
        '201':
          description: Session created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OnboardingSession'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/onboarding/sessions/{id}:
    parameters:
    - {$ref: '#/components/parameters/PathId'}
    patch:
      tags: [onboarding]
      operationId: updateOnboardingSession
      summary: Update the company profile collected by the progressive form.
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateOnboardingSessionRequest'}
      responses:
        '200':
          description: Session updated.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OnboardingSession'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/onboarding/{id}/financial-csv:
    parameters:
    - {$ref: '#/components/parameters/PathId'}
    post:
      tags: [onboarding]
      operationId: uploadFinancialCsv
      summary: Upload the normalized financial CSV. Returns an ImportReport. Does not activate anything.
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/FinancialCsvUpload'}
      responses:
        '201':
          description: Import parsed. Status is draft until explicitly activated.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FinancialImport'}
        '413': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/onboarding/{id}/financial-csv/activate:
    parameters:
    - {$ref: '#/components/parameters/PathId'}
    post:
      tags: [onboarding]
      operationId: activateFinancialSnapshot
      summary: Request activation of a draft import. Creates a signed decision that needs immediate reauth.
      description: 'Answers 202 with a decision of type `activate_financial_snapshot`. The snapshot becomes active, all or

        nothing, only after that decision is signed in a session opened with immediate reauth. Earlier snapshots

        become `superseded` and stay immutable.

        '
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ActivateFinancialSnapshotRequest'}
      responses:
        '202':
          description: Decision created, waiting for its signature.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DecisionAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
  /v1/sourcing-requests:
    post:
      tags: [sourcing]
      operationId: createSourcingRequest
      summary: Turn a natural-language need into a structured SourcingRequest.
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateSourcingRequest'}
      responses:
        '201':
          description: Request normalized. `needs_clarification` lists questions if the need is ambiguous.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SourcingRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
  /v1/missions:
    post:
      tags: [missions]
      operationId: createMission
      summary: Launch sourcing, trust, sanity and negotiation for a sourcing request.
      description: Blocked (409) unless the tenant has an active financial snapshot that is not stale.
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateMissionRequest'}
      responses:
        '201':
          description: Mission started.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Mission'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
  /v1/missions/{id}:
    parameters:
    - {$ref: '#/components/parameters/PathId'}
    get:
      tags: [missions]
      operationId: getMission
      summary: Mission state and graph progress.
      responses:
        '200':
          description: Mission.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Mission'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/missions/{id}/events:
    parameters:
    - {$ref: '#/components/parameters/PathId'}
    get:
      tags: [missions]
      operationId: streamMissionEvents
      summary: Server-Sent Events with mission progress and the live negotiation transcript.
      description: '`text/event-stream`. Each event''s `data` is a JSON `MissionEvent`. `id` is the event id, used

        for `Last-Event-ID` resumption.

        '
      parameters:
      - name: Last-Event-ID
        in: header
        required: false
        schema: {type: string}
      responses:
        '200':
          description: Event stream.
          content:
            text/event-stream:
              schema: {$ref: '#/components/schemas/MissionEvent'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/missions/{id}/offers:
    parameters:
    - {$ref: '#/components/parameters/PathId'}
    get:
      tags: [missions]
      operationId: listMissionOffers
      summary: Offers with SellerConfidence, PriceSanityCheck and FinancialFit attached.
      parameters:
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/Limit'}
      - name: platform
        in: query
        required: false
        schema: {type: string}
      - name: price_band
        in: query
        required: false
        schema: {$ref: '#/components/schemas/PriceSanityBand'}
      - name: confidence_band
        in: query
        required: false
        schema: {$ref: '#/components/schemas/SellerConfidenceBand'}
      responses:
        '200':
          description: Page of offers.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OfferPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/missions/{id}/recommendation:
    parameters:
    - {$ref: '#/components/parameters/PathId'}
    get:
      tags: [missions]
      operationId: getMissionRecommendation
      summary: Explainable ranking (MCDA) for a profile. The LLM narrates; it never ranks.
      parameters:
      - name: profile
        in: query
        required: true
        description: UserProfilePreference id whose weights and constraints are applied.
        schema: {type: string}
      responses:
        '200':
          description: Ranking with per-criterion contributions.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Recommendation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/sellers/{id}/confidence:
    parameters:
    - {$ref: '#/components/parameters/PathId'}
    get:
      tags: [sellers]
      operationId: getSellerConfidence
      summary: Current SellerConfidence with signals, bands and flags, plus history.
      parameters:
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Current confidence and history page.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SellerConfidenceView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/sellers/{id}/confidence/recompute:
    parameters:
    - {$ref: '#/components/parameters/PathId'}
    post:
      tags: [sellers]
      operationId: recomputeSellerConfidence
      summary: Force a recomputation from fresh signals. Audited, not signed.
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200':
          description: Newly computed confidence.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SellerConfidence'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/dashboard/deals:
    get:
      tags: [dashboard]
      operationId: listDeals
      summary: Final deals (negotiated and scored offers) with actions and block reasons.
      parameters:
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/Limit'}
      - name: mission_id
        in: query
        required: false
        schema: {type: string}
      - name: price_band
        in: query
        required: false
        schema: {$ref: '#/components/schemas/PriceSanityBand'}
      - name: confidence_band
        in: query
        required: false
        schema: {$ref: '#/components/schemas/SellerConfidenceBand'}
      - name: financial_verdict
        in: query
        required: false
        schema: {$ref: '#/components/schemas/FinancialVerdict'}
      - name: platform
        in: query
        required: false
        schema: {type: string}
      - name: signature_status
        in: query
        required: false
        schema: {$ref: '#/components/schemas/SignatureStatus'}
      responses:
        '200':
          description: Page of deals.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DealPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/dashboard/deals/{id}/actions:
    parameters:
    - {$ref: '#/components/parameters/PathId'}
    post:
      tags: [dashboard]
      operationId: applyDealAction
      summary: Request a responsible's action on a deal. Every action is a signed decision.
      description: 'Creates the decision for the action and answers 202. The action runs only after the decision is signed.

        A blocked action answers 409 with `blocked` explaining why. `discard` needs `discard_reason` and `comment`.

        '
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DealActionRequest'}
      responses:
        '202':
          description: Decision created, waiting for its signature.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DecisionAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
  /v1/gate/queue:
    get:
      tags: [gate]
      operationId: listGateQueue
      summary: Human gate queue with SLA deadlines.
      parameters:
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/Limit'}
      - name: type
        in: query
        required: false
        schema: {$ref: '#/components/schemas/GateReason'}
      - name: status
        in: query
        required: false
        schema: {$ref: '#/components/schemas/GateStatus'}
      responses:
        '200':
          description: Page of gate items.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GateQueuePage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/gate/queue/{id}/actions:
    parameters:
    - {$ref: '#/components/parameters/PathId'}
    post:
      tags: [gate]
      operationId: applyGateQueueAction
      summary: Request `unblock` or `override_discard` on a gate item. Both are signed decisions.
      description: '`override_discard` is limited to finance, admin and owner, and needs immediate reauth when signed.

        '
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GateQueueActionRequest'}
      responses:
        '202':
          description: Decision created, waiting for its signature.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DecisionAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
  /v1/config/effective:
    get:
      tags: [config]
      operationId: getEffectiveConfig
      summary: Effective tenant configuration for a category, with provenance and version (ADR-400).
      parameters:
      - name: category
        in: query
        required: false
        schema: {type: string, maxLength: 64}
      responses:
        '200':
          description: Effective configuration.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EffectiveConfig'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/config/proposals:
    post:
      tags: [config]
      operationId: proposeConfigChange
      summary: Propose a configuration change. Creates a signed decision that needs immediate reauth.
      description: 'The change creates a new `config_version` only after the decision is signed. A stale

        `base_config_version` answers 409 with reason `stale_config_version`.

        '
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConfigChangeRequest'}
      responses:
        '202':
          description: Decision created, waiting for its signature.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DecisionAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
  /v1/negotiations/{id}/takeover:
    parameters:
    - {$ref: '#/components/parameters/PathId'}
    post:
      tags: [negotiations]
      operationId: takeoverNegotiation
      summary: A human takes control of the chat. The agent stops sending.
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {$ref: '#/components/requestBodies/NegotiationControl'}
      responses:
        '200':
          description: Negotiation under human control.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Negotiation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/negotiations/{id}/resume:
    parameters:
    - {$ref: '#/components/parameters/PathId'}
    post:
      tags: [negotiations]
      operationId: resumeNegotiation
      summary: Return control to the agent.
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {$ref: '#/components/requestBodies/NegotiationControl'}
      responses:
        '200':
          description: Agent resumed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Negotiation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/negotiations/{id}/abort:
    parameters:
    - {$ref: '#/components/parameters/PathId'}
    post:
      tags: [negotiations]
      operationId: abortNegotiation
      summary: Stop the negotiation cleanly.
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {$ref: '#/components/requestBodies/NegotiationControl'}
      responses:
        '200':
          description: Negotiation aborted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Negotiation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/negotiations/{id}:
    parameters:
    - {$ref: '#/components/parameters/PathId'}
    get:
      tags: [negotiations]
      operationId: getNegotiation
      summary: State of a negotiation, including the draft waiting for a human.
      description: 'The transcript itself is `GET /v1/negotiations/{id}/messages`; a draft is not part of it

        until it is sent. Poll this endpoint or follow the mission SSE stream to learn when a new draft

        is waiting.'
      responses:
        '200':
          description: Negotiation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Negotiation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/negotiations/{id}/messages:
    parameters:
    - {$ref: '#/components/parameters/PathId'}
    get:
      tags: [negotiations]
      operationId: listNegotiationMessages
      summary: Transcript of the chat with the seller, oldest first.
      description: 'Messages already exchanged, with their role. Drafts waiting for approval are not here: they

        are `pending_draft` on the negotiation until a human approves or rejects them.'
      parameters:
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Page of messages, oldest first.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NegotiationMessagePage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [negotiations]
      operationId: sendHumanNegotiationMessage
      summary: A human holding the chat writes to the seller.
      description: 'Only while the human holds the conversation (`state: human_control`); otherwise 409 with

        reason `not_in_human_control`. The text is sent as written: the agent neither drafts nor rewords it.

        The same outbound limits apply (message length, hourly cap per account and per seller).'
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NegotiationHumanMessage'}
      responses:
        '201':
          description: Message sent and recorded in the transcript.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NegotiationMessage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
  /v1/negotiations/{id}/approve:
    parameters:
    - {$ref: '#/components/parameters/PathId'}
    post:
      tags: [negotiations]
      operationId: approveNegotiationDraft
      summary: A human approves the drafted message and it is sent to the seller.
      description: 'Phase 1 is semi-automatic (spec 3.6 step 5): nothing leaves until a human approves the

        exact text. The server re-checks the guardrails right before sending and processes seller messages

        that arrived in the meantime, so approval can fail with `draft_superseded` instead of sending a

        stale reply.

        Not a signed decision: approving a message opens no commitment. The agreement it may lead to goes

        through the gate and its signed decision (spec 5.10). The approver is the authenticated principal,

        never a field of the request.

        409 `reason`: `draft_not_pending` (unknown draft, already sent or never existed),

        `draft_superseded` (new seller messages changed the state; review it again),

        `human_in_control` (a human holds the chat; resume first).'
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NegotiationDraftRef'}
      responses:
        '200':
          description: Draft sent. The negotiation shows the state after sending.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Negotiation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
  /v1/negotiations/{id}/reject:
    parameters:
    - {$ref: '#/components/parameters/PathId'}
    post:
      tags: [negotiations]
      operationId: rejectNegotiationDraft
      summary: A human rejects the drafted message; the deterministic template is sent instead.
      description: 'The draft is discarded and the playbook''s own template for the same step takes its place,

        so the negotiation keeps moving without the LLM text. 409 `reason`: `draft_not_pending`.'
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NegotiationDraftRef'}
      responses:
        '200':
          description: Draft replaced by the template and sent.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Negotiation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
  /v1/signing-sessions:
    post:
      tags: [signing]
      operationId: openSigningSession
      summary: Open a 15-minute fixed signing window after a Keycloak step-up.
      description: 'The window is fixed: `expires_at = auth_at + signing.session_minutes` and signing never extends it.

        `auth_at` is the `auth_time` of the step-up token (ADR-900 Q11). A token without the step-up ACR, or

        with an `auth_time` that is too old, answers 428 with reason `step_up_required`. The server keeps the

        session in Redis and in Postgres for audit.

        '
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OpenSigningSessionRequest'}
      responses:
        '201':
          description: Session open.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SigningSession'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '428': {$ref: '#/components/responses/ReauthRequired'}
  /v1/signing-sessions/{id}:
    parameters:
    - {$ref: '#/components/parameters/PathId'}
    get:
      tags: [signing]
      operationId: getSigningSession
      summary: Session state and remaining time.
      responses:
        '200':
          description: Session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SigningSession'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [signing]
      operationId: closeSigningSession
      summary: Close the session explicitly.
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200':
          description: Session closed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SigningSession'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/decisions:
    post:
      tags: [decisions]
      operationId: createDecision
      summary: Create a decision pending signature. The server builds the canonical payload (RFC 8785).
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateDecisionRequest'}
      responses:
        '201':
          description: Decision created with status pending_signature.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Decision'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
  /v1/decisions/{id}/sign:
    parameters:
    - {$ref: '#/components/parameters/PathId'}
    post:
      tags: [decisions]
      operationId: signDecision
      summary: Attach a signature made in the browser over the canonical payload.
      description: 'The server verifies the signature before persisting. It checks the session is alive, the key is not

        revoked, the device matches, and the payload hash matches the stored payload. Immediate-reauth

        decisions require a session opened for that purpose. The private key never reaches the server.

        '
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SignDecisionRequest'}
      responses:
        '201':
          description: Signature recorded.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Signature'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '428': {$ref: '#/components/responses/ReauthRequired'}
  /v1/decisions/{id}/verify:
    parameters:
    - {$ref: '#/components/parameters/PathId'}
    post:
      tags: [decisions]
      operationId: verifyDecision
      summary: On-demand verification of every signature of a decision. Read-only.
      responses:
        '200':
          description: Verification result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VerificationResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/keys/me:
    get:
      tags: [keys]
      operationId: listMySigningKeys
      summary: Public signing keys of the current user, including revoked and historical ones.
      responses:
        '200':
          description: Keys.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SigningKeyList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [keys]
      operationId: registerMySigningKey
      summary: Register the public key of a non-exportable Ed25519 key generated in the browser.
      description: The server stores only the public key. Human private keys never reach the server.
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterSigningKeyRequest'}
      responses:
        '201':
          description: Key registered.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SigningKey'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '428': {$ref: '#/components/responses/ReauthRequired'}
  /v1/keys/{id}/revoke:
    parameters:
    - {$ref: '#/components/parameters/PathId'}
    post:
      tags: [keys]
      operationId: revokeSigningKey
      summary: Revoke a key. Requires a signed `revoke_key` decision. Past signatures stay valid.
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RevokeSigningKeyRequest'}
      responses:
        '200':
          description: Key revoked.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SigningKey'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '428': {$ref: '#/components/responses/ReauthRequired'}
  /v1/audit:
    get:
      tags: [audit]
      operationId: listAuditEvents
      summary: Audit log. Admin and compliance roles only.
      parameters:
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/Limit'}
      - name: subject_ref
        in: query
        required: false
        schema: {type: string}
      - name: event_type
        in: query
        required: false
        schema: {type: string}
      responses:
        '200':
          description: Page of audit events.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditEventPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/audit/verify:
    get:
      tags: [audit]
      operationId: verifyAuditChain
      summary: Re-verify the full hash chain of the tenant and the anchored head.
      responses:
        '200':
          description: Verification result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChainVerification'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/webhooks/platforms/{platform}:
    parameters:
    - name: platform
      in: path
      required: true
      schema: {type: string, pattern: '^[a-z0-9_-]+$'}
    post:
      tags: [webhooks]
      operationId: receivePlatformWebhook
      summary: Inbound event from a marketplace. Authenticated by HMAC signature, not by user token.
      security: []
      parameters:
      - name: X-Apex-Signature
        in: header
        required: true
        description: HMAC-SHA256 of the raw body, hex encoded.
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlatformWebhookEvent'}
      responses:
        '202': {description: Event accepted for processing.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT, description: OIDC access token issued by Keycloak (realm apex).}
  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema: {type: string, minLength: 1}
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned as `next_cursor` by the previous page.
      schema: {type: string}
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated unique key for this write. Replays return the original response.
      schema: {type: string, minLength: 16, maxLength: 128}
  requestBodies:
    NegotiationControl:
      required: false
      content:
        application/json:
          schema: {$ref: '#/components/schemas/NegotiationControlRequest'}
  responses:
    Problem:
      description: RFC 9457 problem.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ValidationProblem:
      description: Request failed validation.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ValidationProblem'}
    Unauthorized:
      description: Missing or invalid token.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Forbidden:
      description: The role of the principal is not allowed (spec 5.9, RBAC).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: Resource not found in the tenant.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: State or business rule conflict. `reason` and `blocked` explain it when present.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Conflict'}
    ReauthRequired:
      description: No valid signing session for this operation. The client runs the Keycloak step-up and retries.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ReauthRequired'}
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status]
      properties:
        type: {type: string, format: uri-reference, default: 'about:blank'}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string}
        instance: {type: string}
      additionalProperties: true
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field: {type: string}
        code: {type: string}
        message: {type: string}
    ValidationProblem:
      allOf:
      - {$ref: '#/components/schemas/Problem'}
      - type: object
        required: [errors]
        properties:
          errors:
            type: array
            items: {$ref: '#/components/schemas/FieldError'}
    BlockReason:
      type: object
      description: Why an action is blocked. The UI shows `message` next to the disabled control.
      required: [code, message]
      properties:
        code: {$ref: '#/components/schemas/BlockReasonCode'}
        message: {type: string}
    BlockReasonCode:
      type: string
      description: Why an action is not available (D4-11). Closed so the UI can translate it.
      enum: [price_band_requires_unblock, seller_band_requires_unblock, out_of_budget, financials_stale, fx_provisional, renegotiation_limit, already_decided, not_in_queue, role_not_allowed, comment_required]
    Conflict:
      allOf:
      - {$ref: '#/components/schemas/Problem'}
      - type: object
        properties:
          reason: {type: string, description: Closed machine-readable reason of the conflict.}
          blocked:
            type: array
            items: {$ref: '#/components/schemas/BlockedAction'}
    ReauthRequired:
      description: Returned with 428 when the signing session is missing, expired, revoked or exhausted.
      allOf:
      - {$ref: '#/components/schemas/Problem'}
      - type: object
        required: [error, reason]
        properties:
          error: {type: string, const: reauth_required}
          reason: {$ref: '#/components/schemas/ReauthReason'}
    ReauthReason:
      type: string
      enum: [session_missing, session_expired, session_revoked, session_exhausted, key_revoked, key_rotated, device_mismatch, network_anomaly, high_value_decision, immediate_reauth_required, risk_flagged, step_up_required]
    Currency:
      type: string
      description: Closed enum. No other currency is accepted anywhere (spec 3.5.1).
      enum: [EUR, USD, CNY]
    Money:
      type: object
      description: Amount in integer minor units (cents, fen). Never a float.
      required: [amount_minor, currency]
      properties:
        amount_minor: {type: integer, format: int64, minimum: -9223372036854775808, maximum: 9223372036854775807}
        currency: {$ref: '#/components/schemas/Currency'}
    ConvertedMoney:
      type: object
      description: Money that may have been converted from another currency at ingestion (spec 3.5.1).
      required: [amount_minor, currency, converted, fx_provisional]
      properties:
        amount_minor: {type: integer, format: int64, minimum: -9223372036854775808, maximum: 9223372036854775807}
        currency: {$ref: '#/components/schemas/Currency'}
        original_amount_minor:
          type: [integer, 'null']
          format: int64
          minimum: -9223372036854775808
          maximum: 9223372036854775807
        original_currency:
          anyOf:
          - {$ref: '#/components/schemas/Currency'}
          - {type: 'null'}
        fx_rate:
          description: Decimal string, never a float.
          type: [string, 'null']
          pattern: ^[0-9]+(\.[0-9]+)?$
        fx_as_of:
          type: [string, 'null']
          format: date-time
        fx_source:
          type: [string, 'null']
        converted: {type: boolean}
        fx_provisional: {type: boolean, description: True when the rate is older than fx.max_age_hours (spec 3.5.1).}
    Actor:
      type: object
      required: [type, id]
      properties:
        type: {$ref: '#/components/schemas/ActorType'}
        id: {type: string}
    PriceSanityBand:
      type: string
      enum: [normal, atypical, implausible, insufficient_reference]
    SellerConfidenceBand:
      type: string
      enum: [high, medium, low, untrusted, insufficient_data]
    FinancialVerdict:
      type: string
      enum: [within_budget, stretch, out_of_budget]
    SignatureStatus:
      type: string
      enum: [unsigned, pending, signed, invalid]
    DecisionType:
      type: string
      enum: [follow, renegotiate, takeover, hold, discard, approve_purchase, activate_financial_snapshot, override_discard, change_pricing_threshold, change_confidence_weights, change_scoring_weights, rotate_key, revoke_key, unblock, config_change]
    DecisionStatus:
      type: string
      enum: [pending_signature, signed, rejected]
    MissionState:
      type: string
      enum: [created, planning, sourcing, enriching, evaluating, negotiating, awaiting_decision, completed, cancelled, failed]
    OfferState:
      type: string
      enum: [discovered, enriched, trust_scored, sanity_checked, gate_pending, gate_approved, gate_rejected, financially_checked, negotiating, negotiated, sanity_rechecked, scored, awaiting_human, signed, approved, rejected, purchased]
    Tenant:
      type: object
      required: [id, name, base_currency]
      properties:
        id: {type: string}
        name: {type: string}
        base_currency: {$ref: '#/components/schemas/Currency'}
    Role:
      type: string
      description: RBAC roles (spec 5.9). Only buyer, finance, admin and owner can sign.
      enum: [owner, admin, buyer, finance, viewer]
    Membership:
      type: object
      required: [user_id, tenant_id, role]
      properties:
        user_id: {type: string}
        tenant_id: {type: string}
        role: {$ref: '#/components/schemas/Role'}
    User:
      type: object
      required: [id, display_name]
      properties:
        id: {type: string}
        display_name: {type: string}
    CompanyProfile:
      type: object
      description: Fiscal identity, sector and activity (spec 3.1).
      required: [legal_name, tax_id, country, base_currency]
      properties:
        legal_name: {type: string}
        tax_id: {type: string, description: CIF or VAT number.}
        country: {type: string, pattern: '^[A-Z]{2}$'}
        shipping_address: {type: string}
        billing_address: {type: string}
        customs_regime:
          type: [string, 'null']
        cnae:
          type: [string, 'null']
        purchase_categories:
          type: array
          items: {type: string}
        purchase_frequency:
          anyOf:
          - {$ref: '#/components/schemas/PurchaseFrequency'}
          - {type: 'null'}
        seasonality:
          type: [string, 'null']
        base_currency: {$ref: '#/components/schemas/Currency'}
        sector:
          type: [string, 'null']
        budget: {$ref: '#/components/schemas/NullableMoney', description: Overall purchasing budget.}
    CreateOnboardingSessionRequest:
      type: object
      required: [base_currency]
      properties:
        company_profile: {$ref: '#/components/schemas/CompanyProfile'}
        base_currency: {$ref: '#/components/schemas/Currency'}
    OnboardingSession:
      type: object
      required: [id, status, company_profile, effective_config, created_at, updated_at]
      properties:
        id: {type: string}
        status: {$ref: '#/components/schemas/OnboardingStatus'}
        company_profile: {$ref: '#/components/schemas/CompanyProfile'}
        active_financial_snapshot_id:
          type: [string, 'null']
        effective_config: {$ref: '#/components/schemas/EffectiveConfig'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    FinancialCsvUpload:
      type: object
      required: [file]
      properties:
        file: {type: string, format: binary, description: 'UTF-8 CSV, long format (spec 3.1.1). Separator is autodetected.'}
    FinancialImport:
      type: object
      description: Result of a CSV import. Status `draft` until a signed activation.
      required: [id, onboarding_id, status, csv_ref, report, created_at]
      properties:
        id: {type: string}
        onboarding_id: {type: string}
        status: {$ref: '#/components/schemas/FinancialImportStatus'}
        csv_ref: {type: string, description: Opaque S3 reference to the original file.}
        report: {$ref: '#/components/schemas/ImportReport'}
        created_at: {type: string, format: date-time}
    ImportReport:
      type: object
      required: [rows_ok, rows_rejected, rejections, warnings, projection_enabled, periods_loaded, reference_date, derived]
      properties:
        rows_ok: {type: integer, minimum: 0}
        rows_rejected: {type: integer, minimum: 0}
        rejections:
          type: array
          items: {$ref: '#/components/schemas/RowRejection'}
        warnings:
          type: array
          description: Written by the LLM from the structured report only. Never contains numbers the code did not compute.
          items: {type: string}
        projection_enabled: {type: boolean}
        periods_loaded: {type: integer, minimum: 0}
        reference_date: {type: string, format: date}
        derived: {$ref: '#/components/schemas/DerivedFinancials'}
    RowRejection:
      type: object
      required: [row, reason_code, message]
      properties:
        row: {type: integer, minimum: 1}
        field:
          type: [string, 'null']
        reason_code: {$ref: '#/components/schemas/RowRejectionReason'}
        message: {type: string}
    DerivedFinancials:
      type: object
      required: [envelopes, net_buying_capacity, buying_power_score]
      properties:
        envelopes:
          type: array
          items: {$ref: '#/components/schemas/BudgetEnvelope'}
        net_buying_capacity: {$ref: '#/components/schemas/Money'}
        buying_power_score:
          type: [integer, 'null']
          description: Null until the BuyingPowerScore formula is decided by the TL (question Q2).
    ActivateFinancialSnapshotRequest:
      type: object
      required: [import_id]
      properties:
        import_id: {type: string, description: Draft import to activate.}
    CompanyFinancialsSnapshot:
      type: object
      description: Immutable once active or superseded (spec 6, 3.1.1).
      required: [id, version, status, import_id, base_currency, created_at]
      properties:
        id: {type: string}
        version: {type: integer, minimum: 1}
        status:
          type: string
          enum: [active, superseded]
        import_id: {type: string}
        base_currency: {$ref: '#/components/schemas/Currency'}
        activated_at:
          type: [string, 'null']
          format: date-time
        activated_by:
          type: [string, 'null']
        decision_id:
          type: [string, 'null']
        superseded_at:
          type: [string, 'null']
          format: date-time
        created_at: {type: string, format: date-time}
    BudgetEnvelope:
      type: object
      required: [category, allocated, spent, available, period_start, period_end]
      properties:
        category: {type: string}
        allocated: {$ref: '#/components/schemas/Money'}
        spent: {$ref: '#/components/schemas/Money'}
        available: {$ref: '#/components/schemas/Money'}
        period_start: {type: string, format: date}
        period_end: {type: string, format: date}
    ConnectedAccount:
      type: object
      description: Marketplace account. Credentials are never returned; only an opaque CredentialRef.
      required: [id, platform, status, credential_ref]
      properties:
        id: {type: string}
        platform: {type: string}
        status: {$ref: '#/components/schemas/ConnectedAccountStatus'}
        credential_ref: {$ref: '#/components/schemas/CredentialRef'}
    CredentialRef:
      type: object
      required: [id]
      properties:
        id: {type: string, description: Opaque vault pointer. Never shown to the LLM or the browser.}
    UserProfilePreference:
      type: object
      description: A profile is weights plus hard constraints, not a UI role (spec 2).
      required: [id, name, weights, negotiation, hard_constraints]
      properties:
        id: {type: string}
        name: {type: string}
        weights:
          type: object
          description: Weight per MCDA criterion, in [0, 1].
          additionalProperties: {type: number, minimum: 0, maximum: 1}
        negotiation: {$ref: '#/components/schemas/NegotiationParams'}
        hard_constraints: {$ref: '#/components/schemas/HardConstraints'}
    NegotiationParams:
      type: object
      required: [aggressiveness, tone, language, accepts_counterparts]
      properties:
        target_discount_bp:
          type: [integer, 'null']
          description: Basis points. Null until the tenant sets it (spec 7, "sin definir").
        max_discount_bp:
          type: [integer, 'null']
          description: Basis points. Null until the tenant sets it (spec 7, "sin definir").
        aggressiveness: {$ref: '#/components/schemas/AggressivenessLevel'}
        tone: {$ref: '#/components/schemas/NegotiationTone'}
        language: {$ref: '#/components/schemas/Language'}
        accepts_counterparts:
          type: array
          items: {$ref: '#/components/schemas/CounterpartType'}
    HardConstraints:
      type: object
      required: [banned_platforms, banned_countries, required_certifications, min_accepted_seller_band]
      properties:
        banned_platforms:
          type: array
          items: {type: string}
        banned_countries:
          type: array
          items: {type: string}
        required_certifications:
          type: array
          items: {type: string}
        min_accepted_seller_band: {$ref: '#/components/schemas/SellerBand'}
        max_lead_time_days:
          type: [integer, 'null']
        approval_threshold: {$ref: '#/components/schemas/NullableMoney'}
    NullableMoney:
      anyOf:
      - {$ref: '#/components/schemas/Money'}
      - {type: 'null'}
    EffectiveConfig:
      type: object
      description: 'Effective tenant configuration (global, then tenant, then category override) with provenance (ADR-400).

        Keys are dotted paths (`sanity.z_gate`). Unset values are null, never invented defaults.

        '
      required: [tenant_id, category, config_version, content_hash, resolved_at, values]
      properties:
        tenant_id: {type: string}
        category:
          type: [string, 'null']
        config_version: {type: integer, minimum: 1, description: Monotonic per tenant (ADR-400).}
        content_hash: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        resolved_at: {type: string, format: date-time}
        values:
          type: object
          additionalProperties: {$ref: '#/components/schemas/EffectiveConfigValue'}
    SanityConfig:
      type: object
      description: Price sanity thresholds (spec 3.3.3, 7). Null means unset.
      required: [min_sample, z_ok, z_gate, low_side_factor, max_relative_rise, max_relative_drop, floor_per_unit, ceiling_per_unit, on_insufficient_reference]
      properties:
        min_sample:
          type: [integer, 'null']
        z_ok:
          type: [number, 'null']
        z_gate:
          type: [number, 'null']
        low_side_factor:
          type: [number, 'null']
        max_relative_rise:
          type: [number, 'null']
        max_relative_drop:
          type: [number, 'null']
        floor_per_unit: {$ref: '#/components/schemas/NullableMoney'}
        ceiling_per_unit: {$ref: '#/components/schemas/NullableMoney'}
        on_insufficient_reference:
          anyOf:
          - {$ref: '#/components/schemas/OnInsufficientReference'}
          - {type: 'null'}
    SellerConfig:
      type: object
      description: Seller confidence thresholds and parameters (spec 3.4, 7). Null means unset.
      required: [rating_prior_weight, age_saturation_days, min_signals, band_high, band_medium, band_low, hard_block_below, min_accepted_band, review_burst_z, max_dispute_rate, snapshot_max_age_days, escalate_cheap_low_confidence]
      properties:
        rating_prior_weight:
          type: [number, 'null']
        age_saturation_days:
          type: [integer, 'null']
        min_signals:
          type: [integer, 'null']
        band_high:
          type: [integer, 'null']
        band_medium:
          type: [integer, 'null']
        band_low:
          type: [integer, 'null']
        hard_block_below:
          type: [integer, 'null']
        min_accepted_band:
          anyOf:
          - {$ref: '#/components/schemas/SellerConfigBand'}
          - {type: 'null'}
        review_burst_z:
          type: [number, 'null']
        max_dispute_rate:
          type: [number, 'null']
        snapshot_max_age_days:
          type: [integer, 'null']
        escalate_cheap_low_confidence:
          type: [boolean, 'null']
    CreateSourcingRequest:
      type: object
      required: [natural_language, delivery_country]
      properties:
        natural_language: {type: string, minLength: 1, maxLength: 4000, description: The need in free text. An agent normalizes it (spec 3.2).}
        delivery_country: {type: string, pattern: '^[A-Z]{2}$'}
        target_delivery_date:
          type: [string, 'null']
          format: date
        max_budget: {$ref: '#/components/schemas/NullableMoney'}
        excluded_platforms:
          type: array
          items: {type: string}
        excluded_countries:
          type: array
          items: {type: string}
    SourcingRequest:
      type: object
      required: [id, status, spec, quantity_tiers, delivery_country, needs_clarification, created_at]
      properties:
        id: {type: string}
        status: {$ref: '#/components/schemas/SourcingRequestStatus'}
        spec: {$ref: '#/components/schemas/SourcingSpec'}
        quantity_tiers:
          type: array
          items: {$ref: '#/components/schemas/QuantityTier'}
        max_budget: {$ref: '#/components/schemas/NullableMoney'}
        target_delivery_date:
          type: [string, 'null']
          format: date
        delivery_country: {type: string}
        needs_clarification:
          type: array
          items: {type: string}
        created_at: {type: string, format: date-time}
    SourcingSpec:
      type: object
      required: [description]
      properties:
        description: {type: string}
        specifications:
          type: object
          additionalProperties: {type: string}
        certifications:
          type: array
          items: {type: string}
    QuantityTier:
      type: object
      required: [quantity, priority]
      properties:
        quantity: {type: integer, minimum: 1}
        priority: {$ref: '#/components/schemas/QuantityPriority'}
    SourcingItem:
      type: object
      required: [id, request_id, spec, quantity_tiers]
      properties:
        id: {type: string}
        request_id: {type: string}
        spec: {$ref: '#/components/schemas/SourcingSpec'}
        quantity_tiers:
          type: array
          items: {$ref: '#/components/schemas/QuantityTier'}
    SourcingPlan:
      type: object
      required: [id, request_id, platforms, queries, created_at]
      properties:
        id: {type: string}
        request_id: {type: string}
        platforms:
          type: array
          items: {type: string}
        queries:
          type: array
          items: {$ref: '#/components/schemas/PlannedQuery'}
        created_at: {type: string, format: date-time}
    CreateMissionRequest:
      type: object
      required: [sourcing_request_id]
      properties:
        sourcing_request_id: {type: string}
        profile_id:
          type: [string, 'null']
        token_budget:
          type: [integer, 'null']
          minimum: 1
          description: Hard LLM token budget for the mission (spec 5.6). Null uses the tenant default.
    Mission:
      type: object
      required: [id, sourcing_request_id, state, offers_discovered, offers_negotiated, offers_in_gate, tokens_used, token_budget, started_at]
      properties:
        id: {type: string}
        sourcing_request_id: {type: string}
        plan_id:
          type: [string, 'null']
        state: {$ref: '#/components/schemas/MissionState'}
        offers_discovered: {type: integer, minimum: 0}
        offers_negotiated: {type: integer, minimum: 0}
        offers_in_gate: {type: integer, minimum: 0}
        tokens_used: {type: integer, minimum: 0}
        token_budget: {type: integer, minimum: 1}
        started_at: {type: string, format: date-time}
        completed_at:
          type: [string, 'null']
          format: date-time
        error:
          anyOf:
          - {$ref: '#/components/schemas/Problem'}
          - {type: 'null'}
    MissionEvent:
      type: object
      description: Payload of one SSE message. The SSE `event` field equals `type`.
      required: [id, mission_id, type, at]
      properties:
        id: {type: string}
        mission_id: {type: string}
        type: {$ref: '#/components/schemas/MissionEventType'}
        at: {type: string, format: date-time}
        data: {type: object, additionalProperties: true}
    Seller:
      type: object
      required: [id, canonical_id, platform_ids, country, risk_flags]
      properties:
        id: {type: string}
        canonical_id: {type: string}
        platform_ids:
          type: array
          items: {type: string}
        country:
          type: [string, 'null']
        risk_flags:
          type: array
          items: {type: string}
    Offer:
      type: object
      description: Normalized offer with enrichment. Spec 3.2 and 6.
      required: [id, mission_id, platform, platform_offer_id, product_key, title, seller_id, seller_name, unit_price, moq, state, discovered_at]
      properties:
        id: {type: string}
        mission_id: {type: string}
        platform: {type: string}
        platform_offer_id: {type: string}
        product_url:
          type: [string, 'null']
          format: uri
        product_key: {type: string}
        title: {type: string}
        specifications:
          type: object
          additionalProperties: {type: string}
        certifications:
          type: array
          items: {type: string}
        seller_id: {type: string}
        seller_name: {type: string}
        seller_country:
          type: [string, 'null']
        unit_price: {$ref: '#/components/schemas/ConvertedMoney'}
        moq: {type: integer, minimum: 1}
        price_tiers:
          type: array
          items: {$ref: '#/components/schemas/PriceTier'}
        shipping:
          anyOf:
          - {$ref: '#/components/schemas/ShippingEstimate'}
          - {type: 'null'}
        incoterm:
          anyOf:
          - {$ref: '#/components/schemas/Incoterm'}
          - {type: 'null'}
        lead_time_days:
          type: [integer, 'null']
          minimum: 0
        state: {$ref: '#/components/schemas/OfferState'}
        seller_confidence:
          anyOf:
          - {$ref: '#/components/schemas/SellerConfidence'}
          - {type: 'null'}
        price_sanity_check:
          anyOf:
          - {$ref: '#/components/schemas/PriceSanityCheck'}
          - {type: 'null'}
        financial_fit:
          anyOf:
          - {$ref: '#/components/schemas/FinancialFit'}
          - {type: 'null'}
        discovered_at: {type: string, format: date-time}
        expires_at:
          type: [string, 'null']
          format: date-time
    OfferPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Offer'}
        next_cursor:
          type: [string, 'null']
    PriceTier:
      type: object
      required: [min_quantity, unit_price]
      properties:
        min_quantity: {type: integer, minimum: 1}
        max_quantity:
          type: [integer, 'null']
          minimum: 1
        unit_price: {$ref: '#/components/schemas/Money'}
    ShippingEstimate:
      type: object
      required: [cost, min_days, max_days]
      properties:
        cost: {$ref: '#/components/schemas/Money'}
        min_days: {type: integer, minimum: 0}
        max_days: {type: integer, minimum: 0}
        carrier:
          type: [string, 'null']
    Incoterm:
      type: string
      enum: [EXW, FCA, FAS, FOB, CFR, CIF, CPT, CIP, DAP, DPU, DDP]
    SellerSignalSnapshot:
      type: object
      description: Immutable raw signals captured at a point in time (spec 3.4.1, 6).
      required: [id, seller_id, captured_at, data_completeness]
      properties:
        id: {type: string}
        seller_id: {type: string}
        account_age_days:
          type: [integer, 'null']
          minimum: 0
        first_sale_date:
          type: [string, 'null']
          format: date
        months_active_last_12:
          type: [integer, 'null']
          minimum: 0
          maximum: 12
        lifetime_transactions:
          type: [integer, 'null']
          minimum: 0
        transactions_12m:
          type: [integer, 'null']
          minimum: 0
        gmv_12m: {$ref: '#/components/schemas/NullableMoney'}
        repeat_buyer_share:
          type: [number, 'null']
          minimum: 0
          maximum: 1
        published_products_count:
          type: [integer, 'null']
          minimum: 0
        catalog_churn_30d:
          type: [number, 'null']
          minimum: 0
          maximum: 1
        spec_completeness_avg:
          type: [number, 'null']
          minimum: 0
          maximum: 1
        reviews_total:
          type: [integer, 'null']
          minimum: 0
        reviews_12m:
          type: [integer, 'null']
          minimum: 0
        rating_avg:
          type: [number, 'null']
          minimum: 0
          maximum: 5
        rating_count:
          type: [integer, 'null']
          minimum: 0
        verified_review_share:
          type: [number, 'null']
          minimum: 0
          maximum: 1
        response_rate:
          type: [number, 'null']
          minimum: 0
          maximum: 1
        identity_verified:
          type: [boolean, 'null']
        trade_assurance:
          type: [boolean, 'null']
        escrow_available:
          type: [boolean, 'null']
        dispute_rate:
          type: [number, 'null']
          minimum: 0
          maximum: 1
        refund_rate:
          type: [number, 'null']
          minimum: 0
          maximum: 1
        data_completeness: {type: number, minimum: 0, maximum: 1, description: 'Present signals over required signals (spec 3.4.1, ADR-303).'}
        captured_at: {type: string, format: date-time}
    ReviewAnomaly:
      type: object
      required: [seller_id, type, severity, evidence, detected_at]
      properties:
        seller_id: {type: string}
        type: {$ref: '#/components/schemas/ReviewAnomalyType'}
        severity: {$ref: '#/components/schemas/ReviewAnomalySeverity'}
        evidence: {type: object, additionalProperties: true}
        detected_at: {type: string, format: date-time}
    SellerConfidence:
      type: object
      description: Deterministic, versioned seller confidence (spec 3.4). Never produced by an LLM.
      required: [seller_id, score, band, signals_normalized, penalties, flags, model_version, computed_at]
      properties:
        seller_id: {type: string}
        score:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: Null when band is insufficient_data.
        band: {$ref: '#/components/schemas/SellerConfidenceBand'}
        signals_normalized:
          type: object
          description: Normalized signals in [0, 1], keyed by signal name.
          additionalProperties: {type: number}
        penalties:
          type: array
          items: {type: string}
        flags:
          type: array
          items: {$ref: '#/components/schemas/ReviewAnomaly'}
        model_version: {type: string}
        snapshot_id:
          type: [string, 'null']
        computed_at: {type: string, format: date-time}
    SellerConfidenceView:
      type: object
      required: [seller, current, history, next_cursor]
      properties:
        seller: {$ref: '#/components/schemas/Seller'}
        current: {$ref: '#/components/schemas/SellerConfidence'}
        history:
          type: array
          items: {$ref: '#/components/schemas/SellerConfidence'}
        next_cursor:
          type: [string, 'null']
    PriceSanityCheck:
      type: object
      description: Persisted for every offer and included in signed payloads (spec 3.3.4).
      required: [offer_id, reference_price_eur, median, dispersion_measure, dispersion_value, sample_size, relative_deviation, band, decision, explanations, config_version, checked_at]
      properties:
        offer_id: {type: string}
        reference_price_eur: {$ref: '#/components/schemas/Money'}
        median: {$ref: '#/components/schemas/Money'}
        dispersion_measure:
          type: string
          enum: [mad, iqr, relative]
        dispersion_value: {type: number}
        sample_size: {type: integer, minimum: 0}
        index_score:
          type: [number, 'null']
        relative_deviation: {type: number}
        band: {$ref: '#/components/schemas/PriceSanityBand'}
        decision: {$ref: '#/components/schemas/SanityDecision'}
        explanations:
          type: array
          items: {$ref: '#/components/schemas/PriceExplanation'}
        config_version: {type: string}
        checked_at: {type: string, format: date-time}
    SanityDecision:
      type: string
      enum: [negotiate, human_gate, discard]
    PriceExplanationCode:
      type: string
      description: Structured causes only. Never free text generated by an LLM (spec 3.3.3).
      enum: [volume_tier_difference, moq_difference, incoterm_difference, quality_grade_difference, specification_difference, seasonal_pricing, clearance_sale, new_seller_promotion, bulk_discount, none]
    PriceHistory:
      type: object
      required: [product_key, seller_id, landed_unit_cost, date]
      properties:
        product_key: {type: string}
        seller_id: {type: string}
        landed_unit_cost: {$ref: '#/components/schemas/Money'}
        date: {type: string, format: date}
        mission_id:
          type: [string, 'null']
    FxRate:
      type: object
      description: Immutable history row (spec 3.5.1). Rate is a decimal string.
      required: [base, quote, rate, as_of, source]
      properties:
        base: {$ref: '#/components/schemas/Currency'}
        quote: {$ref: '#/components/schemas/Currency'}
        rate: {type: string, pattern: '^[0-9]+(\.[0-9]+)?$'}
        as_of: {type: string, format: date-time}
        source: {type: string}
    LandedCostBreakdown:
      type: object
      description: Line by line. The lines add up exactly to `total` in minor units (criterion 4).
      required: [unit_price, quantity, lines, total, unit_landed_cost]
      properties:
        unit_price: {$ref: '#/components/schemas/Money'}
        quantity: {type: integer, minimum: 1}
        lines:
          type: array
          items: {$ref: '#/components/schemas/LandedCostLine'}
        total: {$ref: '#/components/schemas/Money'}
        unit_landed_cost: {$ref: '#/components/schemas/Money'}
    LandedCostLine:
      type: object
      required: [code, amount]
      properties:
        code: {$ref: '#/components/schemas/LandedCostCode'}
        amount: {$ref: '#/components/schemas/Money'}
        source:
          type: [string, 'null']
          description: Identifier of the input that produced the line (duty table, rate id).
    FinancialFit:
      type: object
      required: [offer_id, landed_cost, verdict, reasons, financials_stale, computed_at]
      properties:
        offer_id: {type: string}
        landed_cost: {$ref: '#/components/schemas/LandedCostBreakdown'}
        verdict: {$ref: '#/components/schemas/FinancialVerdict'}
        reasons:
          type: array
          description: Numeric reasons, for example "landed cost 1.234,56 EUR exceeds envelope by 4,2%".
          items: {type: string}
        budget_utilization_bp:
          type: [integer, 'null']
        treasury_impact: {$ref: '#/components/schemas/Money'}
        financials_stale: {type: boolean}
        computed_at: {type: string, format: date-time}
    Recommendation:
      type: object
      description: Explainable ranking. The ranking comes from code; the narrative comes from the LLM (spec 3.7).
      required: [mission_id, profile_id, ranking, excluded, savings, config_version, model_version, generated_at]
      properties:
        mission_id: {type: string}
        profile_id: {type: string}
        ranking:
          type: array
          items: {$ref: '#/components/schemas/RankedOffer'}
        excluded:
          type: array
          description: Offers removed by hard constraints, each with visible reasons.
          items: {$ref: '#/components/schemas/ExcludedOffer'}
        alternatives:
          type: array
          items: {$ref: '#/components/schemas/TradeOff'}
        savings: {$ref: '#/components/schemas/Savings'}
        config_version: {type: string}
        model_version: {type: string}
        generated_at: {type: string, format: date-time}
    RankedOffer:
      type: object
      required: [rank, offer_id, score, breakdown]
      properties:
        rank: {type: integer, minimum: 1}
        offer_id: {type: string}
        score: {type: number, minimum: 0, maximum: 1}
        breakdown:
          type: array
          items: {$ref: '#/components/schemas/ScoreBreakdown'}
        narrative:
          type: [string, 'null']
          description: LLM text built from the numbers above.
    ScoreBreakdown:
      type: object
      description: Contribution of one criterion to the score (spec 3.7, 6).
      required: [criterion, weight, normalized_value, contribution]
      properties:
        criterion: {$ref: '#/components/schemas/ScoreCriterion'}
        weight: {type: number, minimum: 0, maximum: 1}
        normalized_value: {type: number, minimum: 0, maximum: 1}
        contribution: {type: number}
        penalty: {type: number, minimum: 0}
    TradeOff:
      type: object
      description: Explicit trade-off between two offers, for example "cheaper but 18 more days and medium confidence".
      required: [offer_id, versus_offer_id, summary]
      properties:
        offer_id: {type: string}
        versus_offer_id: {type: string}
        summary: {type: string}
    Savings:
      type: object
      required: [vs_list_price, vs_market_median]
      properties:
        vs_list_price: {$ref: '#/components/schemas/NullableMoney'}
        vs_market_median: {$ref: '#/components/schemas/NullableMoney'}
    Negotiation:
      type: object
      required: [id, offer_id, strategy, state, rounds, max_rounds, guardrail_hits]
      properties:
        id: {type: string}
        offer_id: {type: string}
        strategy: {type: string}
        state: {$ref: '#/components/schemas/NegotiationState'}
        rounds: {type: integer, minimum: 0}
        max_rounds:
          type: [integer, 'null']
        guardrail_hits:
          type: array
          items: {$ref: '#/components/schemas/GuardrailHit'}
        pending_draft:
          anyOf:
          - {$ref: '#/components/schemas/NegotiationDraft'}
          - {type: 'null'}
          description: Draft waiting for a human. Present when `state` is `awaiting_approval`.
    NegotiationDraft:
      type: object
      description: 'Message the agent wrote but did not send: Phase 1 sends nothing without a human approval

        (spec 3.6 step 5). `text` is the exact text that will be sent, so the approver sees no surprise.'
      required: [id, text, source, created_at]
      properties:
        id: {type: string}
        text: {type: string}
        source: {$ref: '#/components/schemas/NegotiationDraftSource'}
        created_at: {type: string, format: date-time}
    NegotiationDraftSource:
      type: string
      description: '`llm` is a draft from the `negotiator` role; `template` is the deterministic playbook text,

        used when no draft passed the guardrails.'
      enum: [llm, template]
    NegotiationDraftRef:
      type: object
      required: [draft_id]
      properties:
        draft_id: {type: string, description: Id of the `pending_draft` being approved or rejected.}
    NegotiationHumanMessage:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          description: 'Text to send, as written. It must respect the negotiation''s configured message length

            limit; a longer message is rejected rather than truncated.'
    NegotiationMessagePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/NegotiationMessage'}
        next_cursor:
          type: [string, 'null']
    GuardrailHit:
      type: object
      required: [code, at]
      properties:
        code: {$ref: '#/components/schemas/GuardrailCode'}
        at: {type: string, format: date-time}
        detail:
          type: [string, 'null']
    NegotiationControlRequest:
      type: object
      properties:
        reason:
          type: [string, 'null']
          maxLength: 500
    NegotiationMessage:
      type: object
      required: [id, negotiation_id, role, content, at]
      properties:
        id: {type: string}
        negotiation_id: {type: string}
        role: {$ref: '#/components/schemas/MessageRole'}
        content: {type: string}
        at: {type: string, format: date-time}
        seq:
          type: integer
          minimum: 0
          description: Monotonic position in the conversation. The transcript is ordered by it.
        approved_by:
          type: [string, 'null']
          description: Principal that approved an agent message in semi-automatic mode. Null otherwise.
        screenshot_ref:
          type: [string, 'null']
        redactions: {type: integer, minimum: 0}
    NegotiationOutcome:
      type: object
      description: Result of a negotiation (spec 3.6).
      required: [negotiation_id, offer_id, initial_price, final_price, discount_bp, concessions, terms, seller_confidence, transcript_ref]
      properties:
        negotiation_id: {type: string}
        offer_id: {type: string}
        initial_price: {$ref: '#/components/schemas/Money'}
        final_price: {$ref: '#/components/schemas/Money'}
        discount_bp: {type: integer, description: 'Discount in basis points (1500 = 15,00%).'}
        concessions:
          type: array
          items: {$ref: '#/components/schemas/Concession'}
        terms:
          type: array
          items: {type: string}
        seller_confidence: {$ref: '#/components/schemas/SellerConfidence'}
        transcript_ref: {type: string, description: Opaque S3 reference to the full transcript and screenshots.}
    Deal:
      type: object
      description: Final deal shown on the dashboard. Shows the seller confidence next to the price (spec 3.8).
      required: [id, mission_id, offer, state, price_band, confidence_band, financial_verdict, signature_status, actions, updated_at]
      properties:
        id: {type: string}
        mission_id: {type: string}
        offer: {$ref: '#/components/schemas/Offer'}
        state: {$ref: '#/components/schemas/DealState'}
        price_band: {$ref: '#/components/schemas/PriceSanityBand'}
        confidence_band: {$ref: '#/components/schemas/SellerConfidenceBand'}
        financial_verdict: {$ref: '#/components/schemas/FinancialVerdict'}
        signature_status: {$ref: '#/components/schemas/SignatureStatus'}
        flags:
          type: array
          items: {type: string}
        negotiation:
          anyOf:
          - {$ref: '#/components/schemas/Negotiation'}
          - {type: 'null'}
        outcome:
          anyOf:
          - {$ref: '#/components/schemas/NegotiationOutcome'}
          - {type: 'null'}
        recommendation_rank:
          type: [integer, 'null']
        actions:
          type: array
          items: {$ref: '#/components/schemas/ActionAvailability'}
        updated_at: {type: string, format: date-time}
    DealPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Deal'}
        next_cursor:
          type: [string, 'null']
    DealAction:
      type: string
      enum: [follow, renegotiate, takeover, hold, discard]
    ActionAvailability:
      type: object
      required: [action, allowed, blocked_by]
      properties:
        action: {$ref: '#/components/schemas/DealAction'}
        allowed: {type: boolean}
        blocked_by:
          type: array
          items: {$ref: '#/components/schemas/BlockReason'}
    DiscardReasonCode:
      type: string
      description: Closed reason codes required by discard, plus a comment (spec 3.8, D4-11).
      enum: [price_too_high, seller_not_trusted, spec_mismatch, lead_time, out_of_budget, duplicate, other]
    DealActionRequest:
      type: object
      required: [action]
      properties:
        action: {$ref: '#/components/schemas/DealAction'}
        discard_reason:
          anyOf:
          - {$ref: '#/components/schemas/DiscardReasonCode'}
          - {type: 'null'}
          description: Required when action is discard, together with `comment`.
        comment:
          type: [string, 'null']
          maxLength: 2000
        instructions:
          type: [string, 'null']
          maxLength: 4000
          description: Free instructions for renegotiate.
        hold_until:
          type: [string, 'null']
          format: date-time
          description: Review date for hold.
    GateReason:
      type: string
      description: Causes that send an offer to the human gate (spec 3.8, D4-11).
      enum: [price_atypical, price_insufficient_reference, seller_low, seller_insufficient_data, out_of_budget, stretch_above_threshold, negotiator_escalated, financials_stale, fx_provisional, dual_control_pending]
    GateStatus:
      type: string
      enum: [open, resolved]
    GateQueueItem:
      type: object
      required: [id, mission_id, offer_id, causes, created_at, sla_due_at, status, resolution, decision_id]
      properties:
        id: {type: string}
        mission_id: {type: string}
        offer_id: {type: string}
        causes:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/GateReason'}
        created_at: {type: string, format: date-time}
        sla_due_at: {type: string, format: date-time}
        status: {$ref: '#/components/schemas/GateStatus'}
        resolution:
          anyOf:
          - {$ref: '#/components/schemas/GateResolution'}
          - {type: 'null'}
        decision_id:
          type: [string, 'null']
    GateQueuePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/GateQueueItem'}
        next_cursor:
          type: [string, 'null']
    Approval:
      type: object
      required: [id, decision_id, requested_by, decision, created_at]
      properties:
        id: {type: string}
        decision_id: {type: string}
        requested_by: {$ref: '#/components/schemas/Actor'}
        approver:
          anyOf:
          - {$ref: '#/components/schemas/Actor'}
          - {type: 'null'}
        decision:
          anyOf:
          - {$ref: '#/components/schemas/ApprovalDecision'}
          - {type: 'null'}
        comment:
          type: [string, 'null']
        created_at: {type: string, format: date-time}
    Score:
      type: object
      description: Score of one offer for one profile and configuration.
      required: [offer_id, profile_id, value, config_version, model_version, computed_at]
      properties:
        offer_id: {type: string}
        profile_id: {type: string}
        value: {type: number, minimum: 0, maximum: 1}
        config_version: {type: string}
        model_version: {type: string}
        computed_at: {type: string, format: date-time}
    SigningSession:
      type: object
      description: 'Fixed signing window opened by a strong authentication. `expires_at` never moves with signatures

        (spec 5.10.4). `server_time` lets the UI correct its clock offset before showing mm:ss.

        '
      required: [id, user_id, key_id, auth_method, auth_at, expires_at, device_fingerprint_ref, decisions_signed, max_decisions, remaining_decisions, status, server_time]
      properties:
        id: {type: string}
        user_id: {type: string}
        key_id: {type: string}
        auth_method: {$ref: '#/components/schemas/AuthMethod'}
        auth_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        device_fingerprint_ref: {type: string}
        decisions_signed:
          type: array
          items: {type: string}
        max_decisions: {type: integer, minimum: 1}
        remaining_decisions: {type: integer, minimum: 0}
        status: {$ref: '#/components/schemas/SigningSessionStatus'}
        revoked_reason:
          anyOf:
          - {$ref: '#/components/schemas/ReauthReason'}
          - {type: 'null'}
        server_time: {type: string, format: date-time}
    OpenSigningSessionRequest:
      type: object
      description: The bearer token must come from a Keycloak step-up (ACR plus recent `auth_time`). `auth_at` is taken from `auth_time`.
      required: [key_id, device_fingerprint_ref]
      properties:
        key_id: {type: string}
        device_fingerprint_ref: {type: string}
    CreateDecisionRequest:
      type: object
      required: [type, subject_ref, params]
      properties:
        type: {$ref: '#/components/schemas/DecisionType'}
        subject_ref: {type: string}
        params: {type: object, description: Inputs of the payload builder for this type. The server builds the canonical payload., additionalProperties: true}
    Decision:
      type: object
      required: [id, type, subject_ref, status, payload_canonical, payload_hash, requires_immediate_reauth, required_signers, signatures, created_at]
      properties:
        id: {type: string}
        type: {$ref: '#/components/schemas/DecisionType'}
        subject_ref: {type: string}
        status: {$ref: '#/components/schemas/DecisionStatus'}
        payload_canonical: {type: string, description: 'RFC 8785 (JCS) canonical JSON, UTF-8. These are the bytes to sign.'}
        payload_hash: {type: string, pattern: '^[a-f0-9]{64}$', description: 'SHA-256 of payload_canonical, hex.'}
        requires_immediate_reauth: {type: boolean}
        required_signers: {type: integer, minimum: 1, maximum: 2, description: 2 when the amount is above approval.dual_control_above (spec 5.10.2).}
        signatures:
          type: array
          items: {$ref: '#/components/schemas/Signature'}
        decided_by:
          anyOf:
          - {$ref: '#/components/schemas/Actor'}
          - {type: 'null'}
        created_at: {type: string, format: date-time}
        signed_at:
          type: [string, 'null']
          format: date-time
    SignDecisionRequest:
      type: object
      required: [key_id, payload_hash, signature, signing_session_id]
      properties:
        key_id: {type: string}
        payload_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        signature: {type: string, description: Base64 Ed25519 signature over the canonical payload bytes.}
        signing_session_id: {type: string}
    Signature:
      type: object
      description: Signature record. Each record includes the hash of the previous one (hash chain, spec 5.10.2).
      required: [decision_id, signer_id, key_id, alg, payload_hash, signature, signed_at, signing_session_id, auth_at, chain_hash]
      properties:
        id: {type: string}
        decision_id: {type: string}
        signer_id: {type: string}
        key_id: {type: string}
        alg: {type: string, const: Ed25519}
        payload_hash: {type: string}
        signature: {type: string}
        signed_at: {type: string, format: date-time}
        signing_session_id: {type: string}
        auth_at: {type: string, format: date-time}
        prev_signature_hash:
          type: [string, 'null']
        chain_hash: {type: string, description: Hash of this record including prev_signature_hash.}
        client_attestation:
          type: [string, 'null']
    VerificationResult:
      type: object
      required: [decision_id, valid, checks, verified_at]
      properties:
        decision_id: {type: string}
        valid: {type: boolean}
        checks:
          type: array
          items: {$ref: '#/components/schemas/VerificationCheck'}
        verified_at: {type: string, format: date-time}
    SigningKey:
      type: object
      description: Public key only. Versioned, so revocation never invalidates past signatures.
      required: [id, owner_id, owner_type, public_key, alg, created_at]
      properties:
        id: {type: string}
        owner_id: {type: string}
        owner_type: {$ref: '#/components/schemas/SigningKeyOwnerType'}
        public_key: {type: string, description: Base64 raw Ed25519 public key (32 bytes).}
        alg: {type: string, const: Ed25519}
        label:
          type: [string, 'null']
        created_at: {type: string, format: date-time}
        rotated_at:
          type: [string, 'null']
          format: date-time
        revoked_at:
          type: [string, 'null']
          format: date-time
    SigningKeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/SigningKey'}
    RegisterSigningKeyRequest:
      type: object
      required: [public_key, alg]
      properties:
        public_key: {type: string}
        alg: {type: string, const: Ed25519}
        label:
          type: [string, 'null']
          maxLength: 100
        signing_session_id:
          type: [string, 'null']
    RevokeSigningKeyRequest:
      type: object
      required: [decision_id]
      properties:
        decision_id: {type: string, description: Signed decision of type revoke_key. Needs immediate reauth.}
    AuditEvent:
      type: object
      description: Append-only, hash-chained (spec 5.9, 5.10).
      required: [id, seq, actor, event_type, subject_ref, payload_hash, prev_hash, hash, created_at]
      properties:
        id: {type: string}
        seq: {type: integer, format: int64, minimum: 1, maximum: 9223372036854775807}
        actor: {$ref: '#/components/schemas/Actor'}
        event_type: {type: string}
        subject_ref: {type: string}
        payload_hash: {type: string}
        prev_hash: {type: string}
        hash: {type: string}
        created_at: {type: string, format: date-time}
    AuditEventPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AuditEvent'}
        next_cursor:
          type: [string, 'null']
    ChainVerification:
      type: object
      required: [valid, checked_events, verified_at]
      properties:
        valid: {type: boolean}
        checked_events: {type: integer, format: int64, minimum: -9223372036854775808, maximum: 9223372036854775807}
        head_hash:
          type: [string, 'null']
        first_broken_seq:
          type: [integer, 'null']
          format: int64
          minimum: -9223372036854775808
          maximum: 9223372036854775807
        anchored_head_hash:
          type: [string, 'null']
          description: Head hash stored in S3 Object Lock (compliance mode).
        anchored_at:
          type: [string, 'null']
          format: date-time
        verified_at: {type: string, format: date-time}
    PricingThresholdConfig:
      type: object
      description: Versioned and signed (spec 6, 7). Changing it is a signed decision with immediate reauth.
      required: [id, config_version, sanity, decision_id, created_at]
      properties:
        id: {type: string}
        config_version: {type: string}
        category:
          type: [string, 'null']
        sanity: {$ref: '#/components/schemas/SanityConfig'}
        decision_id: {type: string}
        created_at: {type: string, format: date-time}
    ConfidenceModelConfig:
      type: object
      description: Versioned and signed seller confidence model (spec 6, 3.4.3).
      required: [id, config_version, model_version, seller, decision_id, created_at]
      properties:
        id: {type: string}
        config_version: {type: string}
        model_version: {type: string}
        category:
          type: [string, 'null']
        seller: {$ref: '#/components/schemas/SellerConfig'}
        weights:
          type: object
          description: Weight per signal group (age, sales, catalog, reviews, institutional).
          additionalProperties: {type: number, minimum: 0, maximum: 1}
        decision_id: {type: string}
        created_at: {type: string, format: date-time}
    ScoringWeightsConfig:
      type: object
      description: Versioned and signed MCDA weights (spec 5.10.2).
      required: [id, config_version, weights, decision_id, created_at]
      properties:
        id: {type: string}
        config_version: {type: string}
        profile_id:
          type: [string, 'null']
        weights:
          type: object
          additionalProperties: {type: number, minimum: 0, maximum: 1}
        decision_id: {type: string}
        created_at: {type: string, format: date-time}
    LLMEvent:
      type: object
      description: Accounting entry per LLM call (spec 5.6). Contains no prompt text and no secrets.
      required: [id, role, endpoint, model, prompt_version, tokens_in, tokens_out, latency_ms, created_at]
      properties:
        id: {type: string}
        mission_id:
          type: [string, 'null']
        role: {$ref: '#/components/schemas/LlmRole'}
        endpoint: {type: string}
        model: {type: string}
        prompt_version: {type: string}
        tokens_in: {type: integer, minimum: 0}
        tokens_out: {type: integer, minimum: 0}
        latency_ms: {type: integer, minimum: 0}
        repaired_json: {type: boolean}
        cost: {$ref: '#/components/schemas/NullableMoney'}
        created_at: {type: string, format: date-time}
    PlatformWebhookEvent:
      type: object
      required: [event_type, platform_ref, occurred_at]
      properties:
        event_type: {type: string}
        platform_ref: {type: string}
        occurred_at: {type: string, format: date-time}
        data: {type: object, additionalProperties: true}
    OnboardingStatus:
      type: string
      enum: [profiling, financials_pending, financials_imported, active, completed]
    FinancialImportStatus:
      type: string
      enum: [draft, active, superseded, rejected]
    RowRejectionReason:
      type: string
      enum: [unknown_metric, malformed_period, non_integer_amount, unsupported_currency, duplicate_period_metric, missing_required_field, note_too_long]
    PurchaseFrequency:
      type: string
      enum: [one_off, monthly, quarterly, yearly]
    ConnectedAccountStatus:
      type: string
      enum: [active, session_invalidated, reauth_required, disabled]
    AggressivenessLevel:
      type: string
      enum: [conservative, balanced, aggressive]
    NegotiationTone:
      type: string
      enum: [formal, friendly]
    Language:
      type: string
      enum: [es, en, zh]
    CounterpartType:
      type: string
      description: Counterparts the negotiator may offer (neg.allowed_counterparts). Phase 1 allows only higher_volume and framework_contract (ADR-900 Q15).
      enum: [higher_volume, framework_contract, prepayment, payment_terms, guarantee, penalty]
    SellerBand:
      type: string
      enum: [high, medium]
    SellerConfigBand:
      type: string
      enum: [high, medium, low]
    OnInsufficientReference:
      type: string
      description: Single value since ADR-900 Q12.
      enum: [gate]
    MissionEventType:
      type: string
      enum: [state_changed, offer_discovered, offer_enriched, sanity_checked, trust_scored, financially_checked, gate_opened, negotiation_message, negotiation_state_changed, recommendation_ready, budget_warning, error, keepalive]
    SourcingRequestStatus:
      type: string
      enum: [normalized, needs_clarification]
    QuantityPriority:
      type: string
      enum: [primary, secondary, fallback]
    ReviewAnomalyType:
      type: string
      enum: [burst_velocity, five_star_anomaly, low_verified_share, duplicate_text, creation_correlation]
    ReviewAnomalySeverity:
      type: string
      enum: [warning, critical]
    ScoreCriterion:
      type: string
      enum: [landed_cost, lead_time, seller_confidence, financial_fit, margin_potential, spec_match, compliance_risk, negotiation_gain]
    NegotiationState:
      type: string
      enum: [queued, running, awaiting_approval, human_control, paused, completed, aborted, escalated]
    GuardrailCode:
      type: string
      enum: [max_discount_exceeded, unauthorized_concession, max_rounds, token_budget, message_rate, sensitive_data_request, off_platform_payment, anomalous_price, binding_commitment_attempt, unsupported_currency]
    MessageRole:
      type: string
      enum: [agent, seller, human]
    DealState:
      type: string
      enum: [open, renegotiating, on_hold, human_control, followed, discarded, purchased]
    LandedCostCode:
      type: string
      enum: [goods, shipping, insurance, duties, import_vat, capital_cost, payment_fees, fx_conversion, fx_risk]
    ApprovalDecision:
      type: string
      enum: [approve, reject]
    AuthMethod:
      type: string
      description: Strong authentication that opened the session (ADR-900 Q11).
      enum: [keycloak_step_up]
    SigningSessionStatus:
      type: string
      enum: [active, expired, revoked, exhausted, closed]
    SigningKeyOwnerType:
      type: string
      enum: [human, service]
    ActorType:
      type: string
      enum: [human, service, agent]
    LlmRole:
      type: string
      enum: [planner, negotiator, extractor, narrator, embedder]
    ExcludedOffer:
      type: object
      required: [offer_id, reasons]
      properties:
        offer_id: {type: string}
        reasons:
          type: array
          items: {type: string}
    PlannedQuery:
      type: object
      required: [platform, query]
      properties:
        platform: {type: string}
        query: {type: string}
        filters: {type: object, additionalProperties: true}
    PriceExplanation:
      type: object
      required: [code]
      properties:
        code: {$ref: '#/components/schemas/PriceExplanationCode'}
        detail: {type: string}
    VerificationCheck:
      type: object
      required: [name, ok]
      properties:
        name: {type: string}
        ok: {type: boolean}
        detail:
          type: [string, 'null']
    Concession:
      type: object
      required: [type]
      properties:
        type: {$ref: '#/components/schemas/CounterpartType'}
        detail:
          type: [string, 'null']
    DecisionAccepted:
      type: object
      description: A decision was created and waits for its signature. Nothing has changed yet.
      required: [decision_id, status]
      properties:
        decision_id: {type: string}
        status: {$ref: '#/components/schemas/DecisionStatus'}
    BlockedAction:
      type: object
      description: One action that cannot run, with a closed reason the UI translates (criterion 16).
      required: [action, reason, detail]
      properties:
        action: {type: string}
        reason: {$ref: '#/components/schemas/BlockReasonCode'}
        detail: {type: string}
    GateResolution:
      type: string
      enum: [unblocked, discarded, overridden, held, followed]
    GateQueueAction:
      type: string
      description: '`unblock` lets a held offer proceed. `override_discard` reverses a discard (finance, admin, owner).'
      enum: [unblock, override_discard]
    GateQueueActionRequest:
      type: object
      required: [action]
      properties:
        action: {$ref: '#/components/schemas/GateQueueAction'}
        comment:
          type: [string, 'null']
          maxLength: 2000
    CompanyProfilePatch:
      type: object
      description: Any subset of CompanyProfile fields. Omitted fields keep their value.
      properties:
        legal_name: {type: string}
        tax_id: {type: string, description: CIF or VAT number.}
        country: {type: string, pattern: '^[A-Z]{2}$'}
        shipping_address: {type: string}
        billing_address: {type: string}
        customs_regime:
          type: [string, 'null']
        cnae:
          type: [string, 'null']
        purchase_categories:
          type: array
          items: {type: string}
        purchase_frequency:
          anyOf:
          - {$ref: '#/components/schemas/PurchaseFrequency'}
          - {type: 'null'}
        seasonality:
          type: [string, 'null']
        base_currency: {$ref: '#/components/schemas/Currency'}
        sector:
          type: [string, 'null']
        budget: {$ref: '#/components/schemas/NullableMoney', description: Overall purchasing budget.}
    UpdateOnboardingSessionRequest:
      type: object
      description: Partial profile update from the progressive form.
      required: [company_profile]
      properties:
        company_profile: {$ref: '#/components/schemas/CompanyProfilePatch'}
    ConfigLayer:
      type: string
      enum: [global, tenant, category]
    ConfigValueStatus:
      type: string
      description: '`unset` is "sin definir" (spec 7).'
      enum: [set, unset]
    EffectiveConfigValue:
      type: object
      required: [value, status, layer]
      properties:
        value: {description: 'Resolved value. Null when unset. Money is {amount_minor, currency}; rates are decimal strings or numbers.'}
        status: {$ref: '#/components/schemas/ConfigValueStatus'}
        layer: {$ref: '#/components/schemas/ConfigLayer'}
    ConfigChangeRequest:
      type: object
      required: [base_config_version, patch]
      properties:
        base_config_version: {type: integer, minimum: 1}
        category:
          type: [string, 'null']
        patch: {type: object, description: Deep-merge patch. Explicit null unsets a key., additionalProperties: true}
