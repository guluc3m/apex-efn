name: Tech Lead question
description: Ask the Tech Lead a blocking question. Use an ID from AGENTS.md section 8 when one exists.
title: '[tl-question] '
labels: ['tl-question']
body:
  - type: markdown
    attributes:
      value: 'Agents: start each comment with your lane (for example `DEV-3:`), see AGENTS.md rule 0.9.'
  - type: markdown
    attributes:
      value: |
        Implement the mechanism with the value injected from config or fixtures. Keep the PR in Draft until this is answered.
  - type: dropdown
    id: question_id
    attributes:
      label: Question ID
      options:
        - Q1
        - Q2
        - Q3
        - Q4
        - Q5
        - Q6
        - Q7
        - Q8
        - Q9
        - Q10
        - Q11
        - Q12
        - Q13
        - Q14
        - Q15
        - Q16
        - New (not in section 8)
    validations:
      required: true
  - type: input
    id: blocking
    attributes:
      label: Blocking task IDs
      placeholder: 'D3-02, D3-03'
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options considered
      description: List the options and the trade-off of each.
  - type: textarea
    id: default
    attributes:
      label: Config key or fixture the value will be injected from
      description: Do not propose business numbers as code constants.
