scenarios:
  - name: role-planner
    description: >-
      Matched by the 'role: planner' marker. Returns a valid SourcingPlanDraft naming the two mock
      platforms (D5-04), so a mission plans end to end against the dev stack.
    role: planner
    capabilities:
      "*":
        supports_json_schema: true
        supports_json_object: true
    response:
      kind: json
      content:
        steps:
          - {platform_id: "mock-a", query: "nitrile gloves box 100", tier_index: 0}
          - {platform_id: "mock-b", query: "guantes nitrilo caja 100", tier_index: 0}
        rationale: "Both platforms ship to the EU."
