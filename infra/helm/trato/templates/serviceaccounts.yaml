{{- range $name, $comp := dict "orchestrator" .Values.orchestrator "web" .Values.web "browserWorker" .Values.browserWorker }}
{{- if and $comp.enabled $comp.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "trato.componentName" (dict "root" $ "component" (kebabcase $name)) }}
  labels:
    {{- include "trato.labels" (dict "root" $ "component" (kebabcase $name)) | nindent 4 }}
  {{- with $comp.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
