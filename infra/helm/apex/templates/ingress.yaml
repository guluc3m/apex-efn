{{- if .Values.ingress.enabled }}
{{- $webHost := required "ingress.web.host is required when ingress.enabled=true" .Values.ingress.web.host }}
{{- $apiHost := .Values.ingress.api.host }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "apex.fullname" . }}
  labels:
    {{- include "apex.labels" (dict "root" $ "component" "ingress") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $webHost | quote }}
        {{- if $apiHost }}
        - {{ $apiHost | quote }}
        {{- end }}
      secretName: {{ required "ingress.tls.secretName is required when ingress.tls.enabled=true" .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ $webHost | quote }}
      http:
        paths:
          {{- if .Values.ingress.webhooks.enabled }}
          - path: /v1/webhooks/platforms
            pathType: Prefix
            backend:
              service:
                name: {{ include "apex.componentName" (dict "root" $ "component" "orchestrator") }}
                port:
                  name: http
          {{- end }}
          {{- if .Values.ingress.keycloak.enabled }}
          - path: /realms/apex
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.ingress.keycloak.serviceName }}
                port:
                  number: {{ .Values.ingress.keycloak.servicePort }}
          - path: /resources
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.ingress.keycloak.serviceName }}
                port:
                  number: {{ .Values.ingress.keycloak.servicePort }}
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "apex.componentName" (dict "root" $ "component" "web") }}
                port:
                  name: http
    {{- if $apiHost }}
    - host: {{ $apiHost | quote }}
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: {{ include "apex.componentName" (dict "root" $ "component" "orchestrator") }}
                port:
                  name: http
          - path: /health
            pathType: Exact
            backend:
              service:
                name: {{ include "apex.componentName" (dict "root" $ "component" "orchestrator") }}
                port:
                  name: http
    {{- end }}
{{- end }}
