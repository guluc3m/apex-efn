name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  # =============================================================================
  # TypeScript packages
  # =============================================================================
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  # =============================================================================
  # Python orchestrator
  # =============================================================================
  python:
    name: Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/orchestrator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src/

      - name: Test
        run: uv run pytest

  # =============================================================================
  # Security checks
  # =============================================================================
  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Solo aviso durante el scaffold: volver a bloquear antes de la Fase 1 (zod 4, puppeteer)
      - name: Audit npm dependencies
        continue-on-error: true
        run: pnpm audit --audit-level=high

  # =============================================================================
  # No proprietary LLM endpoints
  # =============================================================================
  llm-portability:
    name: LLM Portability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for proprietary endpoints
        run: |
          # Fail if any proprietary OpenAI endpoints are used
          if grep -rE "(assistants|threads|batches)\.create|api\.anthropic\.com" --include="*.ts" --include="*.py" .; then
            echo "ERROR: Proprietary LLM endpoints detected. Use only OpenAI-compatible /v1/chat/completions"
            exit 1
          fi
          echo "OK: No proprietary endpoints found"
