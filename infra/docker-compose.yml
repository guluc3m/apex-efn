name: apex

# Image tags are pinned on purpose. Bump them in a PR, never switch to `latest`.
# Dev-only credentials below are placeholders; they are not secrets.
# Runbook: docs/runbooks/local-dev.md (ports, URLs, credentials, reset).

services:
  # =============================================================================
  # PostgreSQL 16 + pgvector (one server, one database per service)
  # =============================================================================
  postgres:
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    container_name: apex-postgres
    environment:
      POSTGRES_USER: apex
      POSTGRES_PASSWORD: apex
      POSTGRES_DB: apex
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U apex -d apex']
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # Redis
  # =============================================================================
  redis:
    image: redis:7.4.12-alpine
    container_name: apex-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # MinIO (S3-compatible storage with Object Lock)
  # Upstream Docker Hub images were removed in 2026. The Quay tags below are the
  # last community releases. Override with MINIO_IMAGE / MC_IMAGE if a mirror is
  # needed. Decision pending with the TL (see docs/runbooks/local-dev.md).
  # =============================================================================
  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z}
    container_name: apex-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: creates the buckets with Object Lock. Idempotent, safe to rerun.
  minio-init:
    image: ${MC_IMAGE:-quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z}
    container_name: apex-minio-init
    entrypoint: ['/bin/sh', '/scripts/init-buckets.sh']
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # DEV ONLY. Production retention is a TL decision (not in the spec).
      MINIO_AUDIT_RETENTION: ${MINIO_AUDIT_RETENTION:-1d}
    volumes:
      - ./minio/init-buckets.sh:/scripts/init-buckets.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'

  # =============================================================================
  # Keycloak (OIDC, realm "apex" imported on first start)
  # =============================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: apex-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8080
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: apex
      KC_DB_PASSWORD: apex
    ports:
      - '8080:8080'
    volumes:
      # Imported only when realm "apex" does not exist yet (empty DB).
      - ./keycloak/realm-apex.json:/opt/keycloak/data/import/realm-apex.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  # =============================================================================
  # Vault (dev mode: in-memory, data is lost on restart, root token is public)
  # =============================================================================
  vault:
    image: hashicorp/vault:1.21.4
    container_name: apex-vault
    cap_add:
      - IPC_LOCK
    environment:
      # DEV ONLY root token. Never reuse outside local development.
      VAULT_DEV_ROOT_TOKEN_ID: apex-dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - '8200:8200'
    healthcheck:
      test: ['CMD', 'vault', 'status']
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: enables KV v2 (apex-kv) and Transit, loads the policies and creates the
  # service signing keys. Idempotent, safe to rerun. Dev only.
  vault-init:
    image: hashicorp/vault:1.21.4
    container_name: apex-vault-init
    entrypoint: ['/bin/sh', '/scripts/init.sh']
    environment:
      VAULT_ADDR: http://vault:8200
      # DEV ONLY root token (same as the vault service above).
      VAULT_TOKEN: apex-dev-root-token
      # DEV DEFAULT service list for Transit ed25519 keys. Owned by D2-07.
      VAULT_SERVICE_KEYS: ${VAULT_SERVICE_KEYS:-orchestrator,gate-agent,negotiator}
    volumes:
      - ./vault:/scripts:ro
    depends_on:
      vault:
        condition: service_healthy
    restart: 'no'

  # =============================================================================
  # Unleash (feature flags, own database "unleash")
  # =============================================================================
  unleash:
    image: unleashorg/unleash-server:8.3.1
    container_name: apex-unleash
    environment:
      DATABASE_URL: postgres://apex:apex@postgres:5432/unleash
      # DEV ONLY tokens. Client token is the value of UNLEASH_API_TOKEN in .env.example.
      INIT_ADMIN_API_TOKENS: '*:*.apex-dev-unleash-admin'
      INIT_CLIENT_API_TOKENS: 'default:development.apex-dev-unleash-client'
    ports:
      - '4242:4242'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:4242/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # =============================================================================
  # Langfuse v2 (LLM observability, own database "langfuse")
  # =============================================================================
  langfuse:
    image: langfuse/langfuse:2.95.11
    container_name: apex-langfuse
    environment:
      DATABASE_URL: postgresql://apex:apex@postgres:5432/langfuse
      # DEV ONLY secrets.
      NEXTAUTH_SECRET: langfuse-secret-change-me
      NEXTAUTH_URL: http://localhost:3001
      SALT: langfuse-salt-change-me
    ports:
      - '3001:3000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/api/public/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # =============================================================================
  # LLM stub (Mockoon). Temporary: replaced by apps/llm-stub (D4-02), then removed.
  # =============================================================================
  llm-stub:
    image: mockoon/cli:9.10.0
    container_name: apex-llm-stub
    command: --data /data/openai-stub.json --port 8001
    ports:
      - '8001:8001'
    volumes:
      - ./mocks:/data:ro

  # =============================================================================
  # Observability: OpenTelemetry Collector -> Tempo (traces), Prometheus (metrics),
  # Loki (logs). Apps send OTLP to localhost:4317 (gRPC) or 4318 (HTTP).
  # =============================================================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    container_name: apex-otel-collector
    command: ['--config=/etc/otelcol-contrib/config.yaml']
    volumes:
      - ./otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - '4317:4317'
      - '4318:4318'
    depends_on:
      - tempo
      - prometheus
      - loki

  tempo:
    image: grafana/tempo:2.10.10
    container_name: apex-tempo
    command: ['-config.file=/etc/tempo/tempo.yaml']
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - '3200:3200'

  loki:
    image: grafana/loki:3.6.20
    container_name: apex-loki
    command: ['-config.file=/etc/loki/loki.yaml']
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    ports:
      - '3100:3100'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3100/ready >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: apex-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - '9090:9090'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:9090/-/ready >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:12.4.14
    container_name: apex-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - '3002:3000'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
      - tempo
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # =============================================================================
  # Application services. Off by default: they need Dockerfiles that land with
  # D1-09 (images) and apps/mock-marketplace with D5-04. Start with
  # `docker compose --profile apps up -d --build` once those exist.
  # The web app is not published on the host: `pnpm dev` runs Next.js on :3000.
  # =============================================================================
  orchestrator:
    profiles: ['apps']
    build:
      context: ../apps/orchestrator
    container_name: apex-orchestrator
    environment:
      DATABASE_URL: postgresql://apex:apex@postgres:5432/apex
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      AUTH_ISSUER_URL: http://localhost:8080/realms/apex
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      UNLEASH_URL: http://unleash:4242/api
    ports:
      - '8000:8000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    profiles: ['apps']
    build:
      context: ../apps/web
    container_name: apex-web
    environment:
      DATABASE_URL: postgresql://apex:apex@postgres:5432/apex?schema=public
      REDIS_URL: redis://redis:6379
      ORCHESTRATOR_URL: http://orchestrator:8000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    expose:
      - '3000'
    depends_on:
      postgres:
        condition: service_healthy

  browser-worker:
    profiles: ['apps']
    build:
      context: ../apps/browser-worker
    container_name: apex-browser-worker
    environment:
      REDIS_URL: redis://redis:6379
      VAULT_ADDR: http://vault:8200
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      redis:
        condition: service_healthy

  mock-marketplace:
    profiles: ['apps']
    build:
      context: ../apps/mock-marketplace
    container_name: apex-mock-marketplace
    # Provisional host port. D5-04 confirms it.
    ports:
      - '8002:8002'

volumes:
  postgres_data:
  redis_data:
  minio_data:
  grafana_data:
  tempo_data:
  loki_data:
  prometheus_data:
