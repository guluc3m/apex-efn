{{- if .Values.externalSecrets.enabled }}
{{- range $name, $comp := dict "orchestrator" .Values.orchestrator "web" .Values.web "browserWorker" .Values.browserWorker "llm" .Values.llm }}
{{- if $comp.enabled }}
---
# Materialises the Secret that the component reads through envFrom. Values stay in AWS Secrets Manager.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $comp.secretName }}
  labels:
    {{- include "trato.labels" (dict "root" $ "component" (kebabcase $name)) | nindent 4 }}
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ $.Values.externalSecrets.storeKind }}
    name: {{ $.Values.externalSecrets.storeName }}
  target:
    name: {{ $comp.secretName }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ required (printf "%s.externalSecret.remoteKey is required when externalSecrets.enabled=true" $name) $comp.externalSecret.remoteKey | quote }}
{{- end }}
{{- end }}
{{- end }}
