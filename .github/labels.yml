# Source of truth for repository labels (AGENTS.md D1-02 step 3).
# Apply with the GitHub API or `gh label create --force`. Colors are hex without "#".
- name: needs-tech-lead
  color: B60205
  description: Touches money, thresholds, seller confidence, signatures or compliance. TL merges.
- name: schema-change
  color: 5319E7
  description: Requests a DB schema change. Only DEV-2 writes migrations.
- name: contract-change
  color: 1D76DB
  description: Requests a change to /contracts (public or internal API).
- name: platform-request
  color: 0E8A16
  description: Requests a root, tooling, CI or compose change from DEV-1.
- name: interface
  color: FBCA04
  description: Agrees a cross-lane function signature (AGENTS.md section 4).
- name: tl-question
  color: D93F0B
  description: Question for the Tech Lead (AGENTS.md section 8).
- name: bug
  color: D73A4A
  description: Bug in another lane's code. Must include a failing test.
- name: lane:dev1
  color: C5DEF5
  description: Platform, DevOps and Identity (DEV-1)
- name: lane:dev2
  color: BFD4F2
