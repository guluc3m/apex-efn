{{- if .Values.orchestrator.enabled }}
{{- $c := dict "root" $ "component" "orchestrator" }}
{{- $sa := include "trato.serviceAccountName" (dict "root" $ "component" "orchestrator" "sa" .Values.orchestrator.serviceAccount) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trato.componentName" $c }}
  labels:
    {{- include "trato.labels" $c | nindent 4 }}
spec:
  {{- if not .Values.orchestrator.autoscaling.enabled }}
  replicas: {{ .Values.orchestrator.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "trato.selectorLabels" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "trato.selectorLabels" $c | nindent 8 }}
    spec:
      serviceAccountName: {{ $sa }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "trato.podSecurityContext" $ | nindent 8 }}
      containers:
        - name: orchestrator
          image: {{ include "trato.image" (dict "root" $ "image" .Values.orchestrator.image) | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.orchestrator.containerPort }}
          envFrom:
            {{- include "trato.envFrom" (dict "root" $ "secretName" .Values.orchestrator.secretName) | nindent 12 }}
          {{- with .Values.orchestrator.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- include "trato.containerSecurityContext" $ | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.orchestrator.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "trato.componentName" $c }}
  labels:
    {{- include "trato.labels" $c | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "trato.selectorLabels" $c | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- if .Values.orchestrator.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "trato.componentName" $c }}
  labels:
    {{- include "trato.labels" $c | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "trato.componentName" $c }}
  minReplicas: {{ .Values.orchestrator.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.orchestrator.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.orchestrator.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
