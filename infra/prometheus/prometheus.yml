# Prometheus (dev). Scrapea el exportador de métricas del OpenTelemetry Collector.
# Las métricas de cada lane se definen en docs/observability/metrics.md (D1-07).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']
